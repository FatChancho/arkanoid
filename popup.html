
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebBreakout</title>
  <style>
    body {
      width: 260px;
      padding: 18px;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #171717;
      color: white;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    p {
      color: #bdbdbd;
      font-size: 13px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      background: #facc15;
      color: #171717;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      margin-top: 12px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>WebBreakout</h1>
  <p>Convierte esta página en un Arkanoid.</p>

  <button id="toggleBtn">Activar WebBreakout</button>
  <div id="status" role="status">Desactivado</div>

  <script src="popup.js"></script>
</body>
</html>

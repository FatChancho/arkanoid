<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebBreakout</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 18px;
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
      background: #171923;
      color: white;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    p {
      margin: 0 0 16px;
      color: #a0aec0;
      font-size: 13px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 11px;
      border: 0;
      border-radius: 8px;
      background: #35d9ff;
      color: #10131a;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    #status {
      min-height: 18px;
      margin-top: 12px;
      font-size: 12px;
      color: #a0aec0;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>WebBreakout</h1>
  <p>Convierte la página actual en un escenario destructible.</p>

  <button id="toggleBtn">Activar WebBreakout</button>
  <div id="status" role="status">Preparado</div>

  <script src="popup.js"></script>
</body>
</html>

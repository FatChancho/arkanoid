<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebBreakout</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 18px;
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
      background: #171923;
      color: white;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    p {
      margin: 0 0 16px;
      color: #a0aec0;
      font-size: 13px;
      line-height: 1.5;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 11px 8px;
      border: 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      line-height: 1.3;
    }

    #webBtn {
      background: #35d9ff;
      color: #10131a;
    }

    #arcadeBtn {
      background: #ffd166;
      color: #10131a;
    }

    #deactivateBtn {
      display: none;
      width: 100%;
      padding: 11px;
      border: 0;
      border-radius: 8px;
      background: #ff5d73;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    #status {
      min-height: 18px;
      margin-top: 12px;
      font-size: 12px;
      color: #a0aec0;
      overflow-wrap: anywhere;
    }

    .mode-label {
      font-size: 11px;
      font-weight: 400;
      display: block;
      margin-top: 2px;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <h1>WebBreakout</h1>
  <p>Elige cómo quieres jugar:</p>

  <div class="btn-row" id="startRow">
    <button id="webBtn">
      🌐 Destruir web
      <span class="mode-label">→ Arcade tras destruirla</span>
    </button>
    <button id="arcadeBtn">
      🕹️ Solo Arcade
      <span class="mode-label">Empieza en nivel 1</span>
    </button>
  </div>

  <button id="deactivateBtn">Desactivar WebBreakout</button>

  <div id="status" role="status">Preparado</div>

  <script src="popup.js"></script>
</body>
</html>
